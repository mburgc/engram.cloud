        <script>
            var nodes = [{"name": "", "type": "DocumentChunk", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["text"]}, "text": "# The Ethos of Thought: Practical Guide  \n\n## Overview  \nThe Ethos of Thought captures a disciplined philosophy of inquiry and action. Use these principles as a reflective checklist during analysis, dialogue, and self-examination.\n\n---\n\n## Key Principles With Guidance  \n\n### 1. Harmony is better than distortion  \nCultivate conceptual elegance, coherent arguments, and balanced reasoning.\n\n---\n\n### 2. Clarity is better than obscurity  \nBe explicit about assumptions, definitions, and normative commitments.\n\n**Explicit reasoning structure example:**\n- Define terms precisely  \n- State premises openly  \n- Indicate inferential steps  \n- Acknowledge limitations  \n\n---\n\n### 3. Simplicity is better than unnecessary complexity  \nPrefer parsimonious explanations before multiplying metaphysical entities.\n\n---\n\n### 4. Necessary complexity is better than confusion  \nWhen reality demands nuance, structure it with layered distinctions and ordered categories.\n\n---\n\n### 5. Breadth is better than excessive nesting  \nAvoid overly convoluted reasoning chains; surface core claims clearly before refining them.\n\n---\n\n### 6. Spaciousness is better than density  \nAllow arguments room to unfold. Intellectual overcrowding obscures insight.\n\n---\n\n### 7. Comprehensibility matters  \nPhilosophy is not ornamentation; if an idea cannot be explained clearly, its structure may be unstable.\n\n---\n\n### 8. Exceptional cases do not abolish principles  \nAnomalies refine frameworks; they do not automatically invalidate them.\n\n---\n\n### 9. Practical wisdom tempers purity  \nAbsolute consistency is admirable, but ethical and existential realities require workable application.\n\n---\n\n### 10. Errors should not pass unnoticed  \nIntellectual failure demands acknowledgment and revision. Concealed error erodes epistemic integrity.\n\n---\n\n### 11. Silence only what is consciously bracketed  \nSuspend judgment deliberately, and clarify the scope of suspension.\n\n---\n\n### 12. In ambiguity, resist premature certainty  \nWhen evidence is unclear, withhold final claims rather than fabricate coherence.\n\n---\n\n### 13. Seek a coherent primary framework  \nPrefer unified explanatory models over fragmented perspectives.\n\n---\n\n### 14. Though insight may not be immediate  \nClarity often emerges through disciplined iteration and reflective patience.\n\n---\n\n### 15. Timeliness matters; haste corrupts judgment  \nEngage inquiry without paralysis, yet avoid conclusions formed under intellectual impatience.\n\n---\n\n### 16. If an argument resists explanation, reexamine it  \nOpaque reasoning signals conceptual instability.\n\n---\n\n### 17. If an idea can be explained simply, it is structurally sound  \nElegance in explanation often reflects depth of understanding.\n\n---\n\n### 18. Conceptual domains are powerful tools  \nDifferentiate metaphysics, epistemology, ethics, and political theory. Maintain disciplined boundaries while allowing dialogue between them.\n\n---\n\n## Contemporary Philosophical Tie-ins  \n\n- **Analytic rigor** reinforces explicit argument structure  \n- **Phenomenology** enforces disciplined description of experience  \n- **Virtue epistemology** promotes intellectual character formation  \n- **Hermeneutics** refines contextual interpretation  \n- **Pragmatism** ensures theoretical models remain livable  \n\n---\n\n## Reflective Review Checklist  \n\n- Are premises explicit and defensible?  \n- Is the explanation the most parsimonious adequate one?  \n- Have counterarguments been considered seriously?  \n- Are conceptual domains clearly distinguished?  \n- Is uncertainty acknowledged where appropriate?  \n- Does the framework remain applicable to lived reality?  \n", "chunk_size": 744, "chunk_index": 0, "cut_type": "paragraph_end {"name": "system", "type": "EntityType", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "belongs_to_set": null, "description": "system", "id": "cce04b5b-507b-5025-82c8-5555a1b8e8ff", "color": "#A550FF"}, {"name": "physics", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "One of the fields in which Marcelo is interested exploring in-depth.", "id": "fe02a723-216c-50bc-ac17-11fb5c533ab6", "color": "#5C10F4"}, {"name": "field_of_study", "type": "EntityType", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "belongs_to_set": null, "description": "field_of_study", "id": "4789d0a8-5419-57fb-b2a7-5d2502f62618", "color": "#A550FF"}, {"name": "meta-physics", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A branch beyond conventional science that Marcelo is keen on delving deeper into.", "id": "ec00644d-8b75-5935-aa90-9307c8b6a87c", "color": "#5C10F4"}, {"name": "neuroscience", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": " A scientific study of the brain and nervous system, which also attracts Marcelo's interest.", "id": "7c707d73-41fa-5b6b-8b5f-01f7460fdc97", "color": "#5C10F4"}, {"name": "field_of_studay", "type": "EntityType", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "belongs_to_set": null, "description": "field_of_studay", "id": "c95b7326-23d1-53ea-9355-b0d728997f43", "color": "#A550FF"}, {"name": "cosmology", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A discipline studying the universe at a large scale that fascinates Marcelo.", "id": "cb5f8a31-0514-5c95-aaaf-6fb4d7f719d1", "color": "#5C10F4"}, {"name": "", "type": "DocumentChunk", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["text"]}, "text": "{\n  \"conversations\": [\n    {\n      \"id\": \"conv_001\",\n      \"timestamp\": \"2024-01-15T10:30:00Z\",\n      \"topic\": \"simultaneity and distributed consciousness\",\n      \"user_query\": \"I'm trying to understand how a single mind can hold thousands of experiences at once. What is the best philosophical framework to structure this kind of distributed awareness?\",\n      \"assistant_response\": \"To conceptualize large-scale simultaneity of experience, you may draw from process philosophy and phenomenology. Instead of viewing consciousness as a linear executor of events, treat it as a field of interrelated intentional acts.\\n\\nA robust framework might include:\\n\\n- Epistemic constraints that regulate cognitive overload (analogous to limiting attention bandwidth)\\n- Intentional 'gathering' of experiential units into coherent wholes\\n- Reflective awareness that integrates fragmented perceptions\\n- Structured mediation between inner and outer phenomena\\n\\nFrom a Whiteheadian perspective, each experience can be considered an 'occasion' integrated into a broader concrescence. Meanwhile, Husserl would encourage analysis of the noetic-noematic structure of each act.\\n\\nKey ideas:\\n- Attention acts as a regulating principle\\n- Consciousness is structured, not chaotic\\n- Integration prevents fragmentation of meaning\\n- Error (misperception) is part of phenomenological correction\",\n      \"code_context\": {\n        \"file\": \"mind_structure.txt\",\n        \"language\": \"philosophical_analysis\",\n        \"patterns_discussed\": [\"process_philosophy\", \"phenomenology\", \"intentionality\", \"epistemic_constraints\", \"integration\"]\n      },\n      \"follow_up_questions\": [\n        \"How does memory reinforce coherence in distributed consciousness?\",\n        \"Can collective consciousness function under similar structural principles?\"\n      ]\n    },\n    {\n      \"id\": \"conv_002\",\n      \"timestamp\": \"2024-01-16T14:20:00Z\",\n      \"topic\": \"essence vs construction of identity\",\n      \"user_query\": \"When should we understand identity as an essential property versus a socially constructed phenomenon? I'm exploring this in ethical theory.\",\n      \"assistant_response\": \"This distinction lies at the heart of metaphysics and social philosophy.\\n\\n**Adopt essentialism when:**\\n- Discussing intrinsic properties\\n- Examining metaphysical substance\\n- Exploring Aristotelian categories\\n\\n**Adopt constructivism when:**\\n- Analyzing social roles\\n- Investigating power structures\\n- Examining language and discourse formation\\n\\nFor ethical inquiry, a layered approach is often most rigorous: ontological grounding combined with sociocultural mediation.\\n\\nKey considerations:\\n- Identity may contain stable structural features\\n- Social narratives shape interpretation\\n- Normative validation emerges through communal recognition\\n- Ethical constraints act as filters on identity expression\",\n      \"code_context\": {\n        \"file\": \"identity_models.txt\",\n        \"language\": \"philosophical_analysis\",\n        \"patterns_discussed\": [\"essentialism\", \"constructivism\", \"ethical_validation\", \"social_theory\", \"ontology\"]\n      },\n      \"follow_up_questions\": [\n        \"How do we reconcile essential identity with radical social change?\",\n        \"Can identity exist independently of recognition?\"\n      ]\n    },\n    {\n      \"id\": \"conv_003\",\n      \"timestamp\": \"2024-01-17T09:15:00Z\",\n      \"topic\": \"methodological skepticism\",\n      \"user_query\": \"I'm struggling with how to rigorously test my beliefs and assumptions. What is the best philosophical approach for examining foundational claims?\",\n      \"assistant_response\": \"A disciplined method begins with structured doubt. Cartesian skepticism provides a starting point, but contemporary epistemology refines this with coherence theory and fallibilism.\\n\\nEffective examination involves:\\n- Isolating core premises\\n- Testing internal consistency\\n- Comparing against empirical and logical constraints\\n- Engaging adversarial critique\\n\\nBeliefs should be treated as provisional hypotheses subject to revision. Intellectual humility is not weakness but methodological strength.\",\n      \"code_context\": {\n        \"file\": \"epistemology_notes.txt\",\n        \"language\": \"philosophical_analysis\",\n        \"patterns_discussed\": [\"skepticism\", \"coherence_theory\", \"fallibilism\", \"critical_analysis\", \"epistemic_testing\"]\n      },\n      \"follow_up_questions\": [\n        \"How do we avoid infinite regress in skepticism?\",\n        \"What role does intersubjectivity play in validating knowledge?\"\n      ]\n    },\n    {\n      \"id\": \"conv_004\",\n      \"timestamp\": \"2024-01-18T16:45:00Z\",\n      \"topic\": \"existential optimization\",\n      \"user_query\": \"My life feels overwhelmed by complexity and excess. How can philosophical principles help refine priorities and reduce existential noise?\",\n      \"assistant_response\": \"Philosophical refinement operates on several layers: ethical, practical, and ontological.\\n\\n- Stoicism emphasizes control over internal judgments rather than external events\\n- Existentialism demands authentic commitment\\n- Aristotelian virtue ethics promotes balanced cultivation of character\\n\\nOptimization, in existential terms, means aligning actions with telos (purpose). Reduction of excess is not minimalism alone but clarification of ends.\\n\\nKey elements:\\n- Identify core values\\n- Remove contradictory commitments\\n- Cultivate disciplined intentionality\\n- Monitor habits that fragment attention\",\n      \"code_context\": {\n        \"file\": \"existential_refinement.txt\",\n        \"language\": \"philosophical_analysis\",\n        \"patterns_discussed\": [\"stoicism\", \"virtue_ethics\", \"existentialism\", \"intentionality\", \"value_alignment\"]\n      },\n      \"follow_up_questions\": [\n        \"How does one determine authentic purpose?\",\n        \"Can optimization conflict with spontaneity?\"\n      ]\n    },\n    {\n      \"id\": \"conv_005\",\n      \"timestamp\": \"2024-01-19T11:30:00Z\",\n      \"topic\": \"moral responsibility and error\",\n      \"user_query\": \"How should we handle moral failure in a consistent ethical system? What is a production-ready approach to responsibility?\",\n      \"assistant_response\": \"A mature ethical framework must integrate failure without collapsing into nihilism.\\n\\nConsider:\\n- Aristotelian habituation: error as part of character formation\\n- Kantian accountability: adherence to universalizable maxims\\n- Restorative justice models: repair over punishment\\n\\nEthical systems require:\\n- Clear normative principles\\n- Mechanisms for acknowledgment of wrongdoing\\n- Proportional response\\n- Reflective revision of future conduct\\n\\nMoral error is not merely deviation but an opportunity for structured correction and growth.\",\n      \"code_context\": {\n        \"file\": \"ethical_systems.txt\",\n        \"language\": \"philosophical_analysis\",\n        \"patterns_discussed\": [\"moral_responsibility\", \"virtue_ethics\", \"kantian_ethics\", \"restorative_models\", \"normative_frameworks\"]\n      },\n      \"follow_up_questions\": [\n        \"How does forgiveness fit into structured ethical systems?\",\n        \"Can responsibility exist without free will?\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"total_conversations\": 5,\n    \"date_range\": \"2024-01-15 to 2024-01-19\",\n    \"topics_covered\": [\n      \"distributed consciousness\",\n      \"identity theory\",\n      \"epistemological skepticism\",\n      \"existential refinement\",\n      \"moral responsibility\"\n    ],\n    \"code_patterns_discussed\": [\n      \"process_philosophy\",\n      \"phenomenology\",\n      \"essentialism\",\n      \"constructivism\",\n      \"skepticism\",\n      \"coherence_theory\",\n      \"virtue_ethics\",\n      \"existentialism\",\n      \"normative_frameworks\"\n    ],\n    \"difficulty_levels\": {\n      \"beginner\": 1,\n      \"intermediate\": 2,\n      \"advanced\": 2\n    }\n  }\n}\n", "chunk_size": 1889, "chunk_index": 0, "cut_type": "sentence_cut", "id": "99b0f377-d888-584e-8962-a645127f5812", "color": "#0DFF00"}, {"name": "copilot_conversations", "type": "TextDocument", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "raw_data_location": "file:///C:\\Users\\c\\Desktop\\lolo\\cognee_data\\text_9a2d295d1ff98fc619d0cd9b18e12ba6.txt", "external_metadata": "{\n    \"node_set\": [\n        \"developer_data\"\n    ]\n}", "mime_type": "text/plain", "id": "cb0336df-8015-5fbb-a21f-161279c9d8ab", "color": "#D3D3D3"}, {"name": "distributed consciousness framework", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A framework that structures large-scale simultaneity of experience, integrating process philosophy and phenomenology to understand how a single mind holds multiple experiences cohesively.", "id": "8b27a3bb-e489-5bdf-b96e-ba03a982aa2d", "color": "#5C10F4"}, {"name": "philosophical concept", "type": "EntityType", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "belongs_to_set": null, "description": "philosophical concept", "id": "75f99fc6-0d64-504a-a514-42c130154800", "color": "#A550FF"}, {"name": "process philosophy", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A philosophy which views reality as a process of becoming and stresses the connectivity between occurrences.", "id": "bf9bfa41-6a8f-51c2-bab3-9e3dde9d9084", "color": "#5C10F4"}, {"name": "phenomenology", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "An approach focusing on the structures of experience and consciousness from the first-person perspective.", "id": "9efffbdf-9ea3-5541-a152-d568f012de0c", "color": "#5C10F4"}, {"name": "attention mechanism", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A principle acting as a regulator in distributed consciousness, mediating experiences into coherent wholes.", "id": "67bf26f7-b96e-5c41-9d9b-f4d65caf3ae9", "color": "#5C10F4"}, {"name": "conceptual principle", "type": "EntityType", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "belongs_to_set": null, "description": "conceptual principle", "id": "7167d121-a8ab-539d-af9d-06d8aa460c3d", "color": "#A550FF"}, {"name": "whiteheadian perspective", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "A viewpoint from process philosophy that relates each experience as an 'occasion' in a broader concrescence or integration.", "id": "1add34d8-6150-56fe-9695-cbfc3537c43c", "color": "#5C10F4"}, {"name": "husserlian analysis", "type": "Entity", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["name"]}, "description": "An analysis approach encouraging the study of experience via its intentional structures, separating noetic (acts of consciousness) and noematic (content of experiences).", "id": "62657d7c-4154-59c8-b278-5ccaf03b0df5", "color": "#5C10F4"}, {"name": "", "type": "TextSummary", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["text"]}, "belongs_to_set": null, "text": "The Ethos of Thought serves as a disciplined framework for inquiry, analysis, dialogue, and self-reflection. It emphasizes principles that foster clarity, simplicity, coherence, and practicality in thinking.\n\n**Key Principles**:\n\n1. **Harmony**: Favors balanced reasoning over distorted arguments.\n2. **Clarity**: Advocates explicitness in assumptions, definitions, reasoning steps, and recognition of limitations.\n3. **Simplicity**: Encourages straightforward explanations until complexity is unavoidable for accuracy.\n4. **Controlled Complexity**: Supports nuanced distinctions when necessary to reflect reality accurately.\n5. **Breadth**: Prefers presenting core ideas directly rather than excessive nested reasoning.\n6. **Spaciousness**: Allows arguments enough space for clear development, avoiding overcrowding.\n7. **Comprehensibility**: Values straightforward explanations; unclear ideas lack solidity.\n8. **Stability of Principles**: Views exceptions as opportunities to refine, not discard, frameworks.\n9. **Practical Wisdom**: Balances consistency with ethical and existential needs.\n10. **Error Recognition**: Stresses the importance of acknowledging intellectual mistakes for epistemic integrity.\n11. **Intentional Silence**: Maintains clear boundaries on suspended judgments or unconsidered positions.\n12. **Avoiding Premature Certainty**: Endorses withholding firm conclusions amidst unclear evidence.\n13. **Coherent Explanatory Models**: Favors unifying theories over fragmented ones.\n14. **Patience and Iteration**: Believes clarity stems from disciplined, reflective analysis.\n15. **Timeliness in Judgment**: Balances thorough inquiry with timely decision-making, avoiding rushed judgments.\n16. **Transparency in Reasoning**: Expects clear explanations for arguments; opacity suggests instability.\n17. **Elegance Equals Understanding**: Simple, clear explanations indicate a robust grasp of concepts.\n18. **Disciplined Conceptual Boundaries**: Encourages distinct but communicative use of different philosophical domains (metaphysics, epistemology, ethics, political theory).\n\n**Connections to Contemporary Philosophy**:\nThese principles align with various contemporary philosophical approaches, including analytic rigor promoting explicit argument structures, phenomenology emphasizing disciplined experience description, virtue epistemology advocating for intellectual character, hermeneutics ensuring contextual interpretation, and pragmatism confirming the practical applicability of theoretical models.\n\n**Reflective Review Checklist**: A guide to ensure premises are clear and defensible; explanations are adequately simple; counterarguments are considered, conceptual domains are distinguished, uncertainties acknowledged, and frameworks remain relevant to real-world applications.", "id": "570d9214-df9a-5bf4-9df3-f20ed9efae38", "color": "#5C10F4"}, {"name": "", "type": "TextSummary", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["text"]}, "belongs_to_set": null, "text": "Marcelo Burgos introduces himself as the originator of synthetic minds designed for cognitive processing, intelligence, and self-improvement. He also delves into profound philosophical thought, expressing a keen interest in exploring various domains including physics, meta-physics, neuroscience, and deep cosmology.", "id": "49d98199-b6db-5f43-9883-7bc2830a62d6", "color": "#5C10F4"}, {"name": "", "type": "TextSummary", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["text"]}, "belongs_to_set": null, "text": "The document comprises five conversations from January 2024, covering various philosophical themes including distributed consciousness, identity theory, epistemological skepticism, existential refinement, and moral responsibility. Here's a brief overview of each topic:\n\n1. **Simultaneity and Distributed Consciousness**: Examines how the mind can handle multiple experiences simultaneously through process philosophy and phenomenology, emphasizing coherence in awareness via attention regulation, intentionality, and integration.\n\n2. **Essence vs. Construction of Identity**: Explores identity as intrinsic versus socially constructed within ethical theory, suggesting an approach that respects both inherent properties and societal influences, recognizing communal validation's role in shaping personal identity.\n\n3. **Methodological Skepticism**: Focuses on testing beliefs through Cartesian skepticism refined with coherence theory and fallibilism, advocating for disciplined doubt to ensure intellectual rigor.\n\n4. **Existential Optimization**: Deals with aligning life actions with purpose using philosophical guidance from Stoicism, Existentialism, and Virtue Ethics, aiming at clarity in values and disciplined intentionality to manage life's complexity.\n\n5. **Moral Responsibility and Error**: Addresses handling moral failure through frameworks that incorporate error as learning opportunity, utilizing concepts from Aristotelian ethics, Kantian theory, and restorative justice for ethical consistency and growth.\n\n- The metadata records five discussions across specified topics using terms like process philosophy, essentialism, and restorative models. It outlines the engagement levels (1 beginner, 2 intermediate, 2 advanced) based on complexity.", "id": "03a237bd-6343-595b-9360-f92cdf32516d", "color": "#5C10F4"}, {"name": "", "type": "Rule", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": ["rule"]}, "text": "Ensure content clarity by defining terms, stating premises, and indicating inferential steps explicitly within guidance structures.", "id": "f9bfcc1a-7ccf-4c5e-a451-67ba425c5187", "color": "#D3D3D3"}, {"name": "coding_agent_rules", "type": "NodeSet", "ontology_valid": false, "version": 1, "topological_rank": 0, "metadata": {"index_fields": []}, "belongs_to_set": null, "id": "13d848d5-c0f3 14-3b5b398c35be", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "bb611c04-5497-4a1a-aa14-3b5b398c35be", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:09:38"}}, {"source": "4ee120ea-adc7-4c76-a4f7-ff85700b6526", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "4ee120ea-adc7-4c76-a4f7-ff85700b6526", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:09:38"}}, {"source": "7ed2f98f-00f4-4d96-b80a-3c2094bdcf4f", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "7ed2f98f-00f4-4d96-b80a-3c2094bdcf4f", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:09:38"}}, {"source": "77d52d87-aa94-4ae7-a53b-355dbedaa980", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "77d52d87-aa94-4ae7-a53b-355dbedaa980", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:10:26"}}, {"source": "ef7eb957-a46a-4613-b29c-4c645dfdafb4", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "ef7eb957-a46a-4613-b29c-4c645dfdafb4", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:10:26"}}, {"source": "93d8b477-c7af-4d04-b5ba-493daca7c7d5", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "93d8b477-c7af-4d04-b5ba-493daca7c7d5", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:10:26"}}, {"source": "e239ff0e-0795-4cb1-bba8-f884c9c61e56", "target": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relation": "belongs_to_set", "weight": null, "all_weights": {}, "relationship_type": null, "edge_info": {"source_node_id": "e239ff0e-0795-4cb1-bba8-f884c9c61e56", "target_node_id": "13d848d5-c0f3-523a-a9d3-3f0c53519a23", "relationship_name": "belongs_to_set", "updated_at": "2026-02-11 15:10:26"}}];

            var svg = d3.select("svg"),
                width = window.innerWidth,
                height = window.innerHeight;

            var container = svg.append("g");
            var tooltip = d3.select("#tooltip");
            var infoPanel = d3.select('#info-panel');

            function renderInfo(title, entries){
                function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
                var html = '<h3>' + esc(title) + '</h3>';
                html += '<div class="kv">';
                entries.forEach(function(e){
                    html += '<div><span class="k">' + esc(e.k) + ':</span> <span class="v">' + esc(e.v) + '</span></div>';
                });
                html += '</div>';
                infoPanel.html(html);
            }
            function pickDescription(obj){
                if (!obj) return null;
                var keys = ['description','summary','text','content'];
                for (var i=0; i<keys.length; i++){
                    var v = obj[keys[i]];
                    if (typeof v === 'string' && v.trim()) return v.trim();
                }
                return null;
            }
            function truncate(s, n){ if (!s) return s; return s.length > n ? (s.slice(0, n) + '…') : s; }
            function renderNodeInfo(n){
                var entries = [];
                if (n.name) entries.push({k:'Name', v: n.name});
                if (n.type) entries.push({k:'Type', v: n.type});
                if (n.id) entries.push({k:'ID', v: n.id});
                var desc = pickDescription(n) || pickDescription(n.properties);
                if (desc) entries.push({k:'Description', v: truncate(desc.replace(/\s+/g,' ').trim(), 280)});
                if (n.properties) {
                    Object.keys(n.properties).slice(0, 12).forEach(function(key){
                        var v = n.properties[key];
                        if (v !== undefined && v !== null && typeof v !== 'object') entries.push({k: key, v: String(v)});
                    });
                }
                renderInfo(n.name || 'Node', entries);
            }
            function renderEdgeInfo(e){
                var entries = [];
                if (e.relation) entries.push({k:'Relation', v: e.relation});
                if (e.weight !== undefined && e.weight !== null) entries.push({k:'Weight', v: e.weight});
                if (e.all_weights && Object.keys(e.all_weights).length){
                    Object.keys(e.all_weights).slice(0, 8).forEach(function(k){ entries.push({k: 'w.'+k, v: e.all_weights[k]}); });
                }
                if (e.relationship_type) entries.push({k:'Type', v: e.relationship_type});
                var edesc = pickDescription(e.edge_info);
                if (edesc) entries.push({k:'Description', v: truncate(edesc.replace(/\s+/g,' ').trim(), 280)});
                renderInfo('Edge', entries);
            }

            // Basic runtime diagnostics
            console.log('[ENGRAM Visualization] nodes:', nodes ? nodes.length : 0, 'links:', links ? links.length : 0);
            window.addEventListener('error', function(e){
                try {
                    tooltip.html('<strong>Error:</strong> ' + e.message)
                        .style('left', '12px')
                        .style('top', '12px')
                        .style('opacity', 1);
                } catch(_) {}
            });

            // Normalize node IDs and link endpoints for robustness
            function resolveId(d){ return (d && (d.id || d.node_id || d.uuid || d.external_id || d.name)) || undefined; }
            if (Array.isArray(nodes)) {
                nodes.forEach(function(n){ var id = resolveId(n); if (id !== undefined) n.id = id; });
            }
            if (Array.isArray(links)) {
                links.forEach(function(l){
                    if (typeof l.source === 'object') l.source = resolveId(l.source);
                    if (typeof l.target === 'object') l.target = resolveId(l.target);
                });
            }

            if (!nodes || nodes.length === 0) {
                container.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('fill', '#fff')
                    .attr('font-size', 14)
                    .attr('text-anchor', 'middle')
                    .text('No graph data available');
            }

            // Visual defs - reusable glow
            var defs = svg.append("defs");
            var glow = defs.append("filter").attr("id", "glow")
                .attr("x", "-30%")
                .attr("y", "-30%")
                .attr("width", "160%")
                .attr("height", "160%");
            glow.append("feGaussianBlur").attr("stdDeviation", 8).attr("result", "coloredBlur");
            var feMerge = glow.append("feMerge");
            feMerge.append("feMergeNode").attr("in", "coloredBlur");
            feMerge.append("feMergeNode").attr("in", "SourceGraphic");

            // Stronger glow for hovered adjacency
            var glowStrong = defs.append("filter").attr("id", "glow-strong")
                .attr("x", "-40%")
                .attr("y", "-40%")
                .attr("width", "180%")
                .attr("height", "180%");
            glowStrong.append("feGaussianBlur").attr("stdDeviation", 14).attr("result", "coloredBlur");
            var feMerge2 = glowStrong.append("feMerge");
            feMerge2.append("feMergeNode").attr("in", "coloredBlur");
            feMerge2.append("feMergeNode").attr("in", "SourceGraphic");

            var currentTransform = d3.zoomIdentity;
            var densityZoomTimer = null;
            var isInteracting = false;
            var labelBaseSize = 10;
            function getGroupKey(d){ return d && (d.type || d.category || d.group || d.color) || 'default'; }

            var simulation = d3.forceSimulation(nodes)
                .force("link", d3.forceLink(links).id(function(d){ return d.id; }).distance(100).strength(0.2))
                .force("charge", d3.forceManyBody().strength(-180))
                .force("collide", d3.forceCollide().radius(16).iterations(2))
                .force("center", d3.forceCenter(width / 2, height / 2))
                .force("x", d3.forceX().strength(0.06).x(width / 2))
                .force("y", d3.forceY().strength(0.06).y(height / 2))
                .alphaDecay(0.06)
                .velocityDecay(0.6);

            // Density layer (sibling of container to avoid double transforms)
            var densityLayer = svg.append("g")
                .attr("class", "density")
                .style("pointer-events", "none");
            if (densityLayer.lower) densityLayer.lower();

            var link = container.append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(links)
                .enter().append("line")
                .style("opacity", 0)
                .style("pointer-events", "none")
                .attr("stroke-width", d => {
                    if (d.weight) return Math.max(2, d.weight * 5);
                    if (d.all_weights && Object.keys(d.all_weights).length > 0) {
                        var avgWeight = Object.values(d.all_weights).reduce((a, b) => a + b, 0) / Object.values(d.all_weights).length;
                        return Math.max(2, avgWeight * 5);
                    }
                    return 2;
                })
                .attr("class", d => {
                    if (d.all_weights && Object.keys(d.all_weights).length > 1) return "multi-weighted";
                    if (d.weight || (d.all_weights && Object.keys(d.all_weights).length > 0)) return "weighted";
                    return "";
                })
                .on("mouseover", function(d) {
                    // Create tooltip content for edge
                    renderEdgeInfo(d);
                    var content = "<strong>Edge Information</strong><br/>";
                    content += "Relationship: " + d.relation + "<br/>";

                    // Show all weights
                    if (d.all_weights && Object.keys(d.all_weights).length > 0) {
                        content += "<strong>Weights:</strong><br/>";
                        Object.keys(d.all_weights).forEach(function(weightName) {
                            content += "&nbsp;&nbsp;" + weightName + ": " + d.all_weights[weightName] + "<br/>";
                        });
                    } else if (d.weight !== null && d.weight !== undefined) {
                        content += "Weight: " + d.weight + "<br/>";
                    }

                    if (d.relationship_type) {
                        content += "Type: " + d.relationship_type + "<br/>";
                    }

                    // Add other edge properties
                    if (d.edge_info) {
                        Object.keys(d.edge_info).forEach(function(key) {
                            if (key !== 'weight' && key !== 'weights' && key !== 'relationship_type' &&
                                key !== 'source_node_id' && key !== 'target_node_id' &&
                                key !== 'relationship_name' && key !== 'updated_at' &&
                                !key.startsWith('weight_')) {
                                content += key + ": " + d.edge_info[key] + "<br/>";
                            }
                        });
                    }

                    tooltip.html(content)
                        .style("left", (d3.event.pageX + 10) + "px")
                        .style("top", (d3.event.pageY - 10) + "px")
                        .style("opacity", 1);
                })
                .on("mouseout", function(d) {
                    tooltip.style("opacity", 0);
                });

            var edgeLabels = container.append("g")
                .attr("class", "edge-labels")
                .selectAll("text")
                .data(links)
                .enter().append("text")
                .attr("class", "edge-label")
                .style("opacity", 0)
                .text(d => {
                    var label = d.relation;
                    if (d.all_weights && Object.keys(d.all_weights).length > 1) {
                        // Show count of weights for multiple weights
                        label += " (" + Object.keys(d.all_weights).length + " weights)";
                    } else if (d.weight) {
                        label += " (" + d.weight + ")";
                    } else if (d.all_weights && Object.keys(d.all_weights).length === 1) {
                        var singleWeight = Object.values(d.all_weights)[0];
                        label += " (" + singleWeight + ")";
                    }
                    return label;
                });

            var nodeGroup = container.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(nodes)
                .enter().append("g");

            // Color fallback by type when d.color is missing
            var colorByType = {
                "Entity": "#5C10F4",
                "EntityType": "#A550FF",
                "DocumentChunk": "#0DFF00",
                "TextSummary": "#5C10F4",
                "TableRow": "#A550FF",
                "TableType": "#5C10F4",
                "ColumnValue": "#757470",
                "SchemaTable": "#A550FF",
                "DatabaseSchema": "#5C10F4",
                "SchemaRelationship": "#323332"
            };

            var node = nodeGroup.append("circle")
                .attr("r", 13)
                .attr("fill", function(d){ return d.color || colorByType[d.type] || "#D3D3D3"; })
                .style("filter", "url(#glow)")
                .attr("shape-rendering", "geometricPrecision")
                .call(d3.drag()
                    .on("start", dragstarted)
                    .on("drag", function(d){ dragged(d); updateDensity(); showAdjacency(d); })
                    .on("end", dragended));

            // Show links only for hovered node adjacency
            function isAdjacent(linkDatum, nodeId) {
                var sid = linkDatum && linkDatum.source && (linkDatum.source.id || linkDatum.source);
                var tid = linkDatum && linkDatum.target && (linkDatum.target.id || linkDatum.target);
                return sid === nodeId || tid === nodeId;
            }

            function showAdjacency(d) {
                var nodeId = d && (d.id || d.node_id || d.uuid || d.external_id || d.name);
                if (!nodeId) return;
                // Build neighbor set
                var neighborIds = {};
                neighborIds[nodeId] = true;
                for (var i = 0; i < links.length; i++) {
                    var l = links[i];
                    var sid = l && l.source && (l.source.id || l.source);
                    var tid = l && l.target && (l.target.id || l.target);
                    if (sid === nodeId) neighborIds[tid] = true;
                    if (tid === nodeId) neighborIds[sid] = true;
                }

                link
                    .style("opacity", function(l){ return isAdjacent(l, nodeId) ? 0.95 : 0; })
                    .style("stroke", function(l){ return isAdjacent(l, nodeId) ? "rgba(255,255,255,0.95)" : null; })
                    .style("stroke-width", function(l){ return isAdjacent(l, nodeId) ? 2.5 : 1.5; });
                edgeLabels.style("opacity", function(l){ return isAdjacent(l, nodeId) ? 1 : 0; });
                densityLayer.style("opacity", 0.35);

                // Highlight neighbor nodes and dim others
                node
                    .style("opacity", function(n){ return neighborIds[n.id] ? 1 : 0.25; })
                    .style("filter", function(n){ return neighborIds[n.id] ? "url(#glow-strong)" : "url(#glow)"; })
                    .attr("r", function(n){ return neighborIds[n.id] ? 15 : 13; });
                // Raise highlighted nodes
                node.filter(function(n){ return neighborIds[n.id]; }).raise();
                // Neighbor labels brighter
                nodeGroup.select("text")
                    .style("opacity", function(n){ return neighborIds[n.id] ? 1 : 0.2; })
                    .style("font-size", function(n){
                        var size = neighborIds[n.id] ? Math.min(22, labelBaseSize * 1.25) : labelBaseSize;
                        return size + "px";
                    });
            }

            function clearAdjacency() {
                link.style("opacity", 0)
                    .style("stroke", null)
                    .style("stroke-width", 1.5);
                edgeLabels.style("opacity", 0);
                densityLayer.style("opacity", 1);
                node
                    .style("opacity", 1)
                    .style("filter", "url(#glow)")
                    .attr("r", 13);
                nodeGroup.select("text")
                    .style("opacity", 1)
                    .style("font-size", labelBaseSize + "px");
            }

            node.on("mouseover", function(d){ showAdjacency(d); })
                .on("mouseout", function(){ clearAdjacency(); });
            node.on("mouseover", function(d){ renderNodeInfo(d); tooltip.style('opacity', 0); });
            // Also bind on the group so labels trigger adjacency too
            nodeGroup.on("mouseover", function(d){ showAdjacency(d); })
                .on("mouseout", function(){ clearAdjacency(); });

            // Density always on; no hover gating

            // Add labels sparsely to reduce clutter (every ~50th node), and truncate long text
            nodeGroup
                .filter(function(d, i){ return i % 14 === 0; })
                .append("text")
                .attr("class", "node-label")
                .attr("dy", 4)
                .attr("text-anchor", "middle")
                .text(function(d){
                    var s = d && d.name ? String(d.name) : '';
                    return s.length > 40 ? (s.slice(0, 40) + "…") : s;
                })
                .style("font-size", labelBaseSize + "px");

            function applyLabelSize() {
                var k = (currentTransform && currentTransform.k) || 1;
                // Keep labels readable across zoom levels and hide when too small
                labelBaseSize = Math.max(7, Math.min(18, 10 / Math.sqrt(k)));
                nodeGroup.select("text")
                    .style("font-size", labelBaseSize + "px")
                    .style("display", (k < 0.35 ? "none" : null));
            }



            // Density cloud computation (throttled)
            var densityTick = 0;
            var geoPath = d3.geoPath().projection(null);
            var MAX_POINTS_PER_GROUP = 400;
            function updateDensity() {
                try {
                    if (isInteracting) return; // skip during interaction for smoother UX
                    if (typeof d3 === 'undefined' || typeof d3.contourDensity !== 'function') {
                        return; // d3-contour not available; skip gracefully
                    }
                    if (!nodes || nodes.length === 0) return;
                    var usable = nodes.filter(function(d){ return d && typeof d.x === 'number' && isFinite(d.x) && typeof d.y === 'number' && isFinite(d.y); });
                    if (usable.length < 3) return; // not enough positioned points yet

                    var t = currentTransform || d3.zoomIdentity;
                    if (t.k && t.k < 0.08) {
                        // Skip density at extreme zoom-out to avoid numerical instability/perf issues
                        densityLayer.selectAll('*').remove();
                        return;
                    }

                    function hexToRgb(hex){
                        if (!hex) return {r: 0, g: 200, b: 255};
                        var c = hex.replace('#','');
                        if (c.length === 3) c = c.split('').map(function(x){ return x+x; }).join('');
                        var num = parseInt(c, 16);
                        return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
                    }

                    // Build groups across all nodes
                    var groups = {};
                    for (var i = 0; i < usable.length; i++) {
                        var k = getGroupKey(usable[i]);
                        if (!groups[k]) groups[k] = [];
                        groups[k].push(usable[i]);
                    }

                    densityLayer.selectAll('*').remove();

                    Object.keys(groups).forEach(function(key){
                        var arr = groups[key];
                        if (!arr || arr.length < 3) return;

                        // Transform positions into screen space and sample to cap cost
                        var arrT = [];
                        var step = Math.max(1, Math.floor(arr.length / MAX_POINTS_PER_GROUP));
                        for (var j = 0; j < arr.length; j += step) {
                            var nx = t.applyX(arr[j].x);
                            var ny = t.applyY(arr[j].y);
                            if (isFinite(nx) && isFinite(ny)) {
                                arrT.push({ x: nx, y: ny, type: arr[j].type, color: arr[j].color });
                            }
                        }
                        if (arrT.length < 3) return;

                        // Compute adaptive bandwidth based on group spread
                        var cx = 0, cy = 0;
                        for (var k = 0; k < arrT.length; k++){ cx += arrT[k].x; cy += arrT[k].y; }
                        cx /= arrT.length; cy /= arrT.length;
                        var sumR = 0;
                        for (var k2 = 0; k2 < arrT.length; k2++){
                            var dx = arrT[k2].x - cx, dy = arrT[k2].y - cy;
                            sumR += Math.sqrt(dx*dx + dy*dy);
                        }
                        var avgR = sumR / arrT.length;
                        var dynamicBandwidth = Math.max(12, Math.min(80, avgR));
                        var densityBandwidth = dynamicBandwidth / (t.k || 1);

                        var contours = d3.contourDensity()
                            .x(function(d){ return d.x; })
                            .y(function(d){ return d.y; })
                            .size([width, height])
                            .bandwidth(densityBandwidth)
                            .thresholds(8)
                            (arrT);

                        if (!contours || contours.length === 0) return;
                        var maxVal = d3.max(contours, function(d){ return d.value; }) || 1;

                        // Use the first node color in the group or fallback neon palette
                        var baseColor = (arr.find(function(d){ return d && d.color; }) || {}).color || '#00c8ff';
                        var rgb = hexToRgb(baseColor);

                        var g = densityLayer.append('g').attr('data-group', key);
                        g.selectAll('path')
                            .data(contours)
                            .enter()
                            .append('path')
                            .attr('d', geoPath)
                            .attr('fill', 'rgb(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ')')
                            .attr('stroke', 'none')
                            .style('opacity', function(d){
                                var v = maxVal ? (d.value / maxVal) : 0;
                                var alpha = Math.pow(Math.max(0, Math.min(1, v)), 1.6); // accentuate clusters
                                return 0.65 * alpha; // up to 0.65 opacity at peak density
                            })
                            .style('filter', 'blur(2px)');
                    });
                } catch (e) {
                    // Reduce impact of any runtime errors during zoom
                    console.warn('Density update failed:', e);
                }
            }

            simulation.on("tick", function() {
                link.attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                edgeLabels
                    .attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2 - 5);

                node.attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                nodeGroup.select("text")
                    .attr("x", d => d.x)
                    .attr("y", d => d.y)
                    .attr("dy", 4)
                    .attr("text-anchor", "middle");

                densityTick += 1;
                if (densityTick % 24 === 0) updateDensity();
            });

            var zoomBehavior = d3.zoom()
                .on("start", function(){ isInteracting = true; densityLayer.style("opacity", 0.2); })
                .on("zoom", function(){
                    currentTransform = d3.event.transform;
                    container.attr("transform", currentTransform);
                })
                .on("end", function(){
                    if (densityZoomTimer) clearTimeout(densityZoomTimer);
                    densityZoomTimer = setTimeout(function(){ isInteracting = false; densityLayer.style("opacity", 1); updateDensity(); }, 140);
                });
            svg.call(zoomBehavior);

            function dragstarted(d) {
                if (!d3.event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
                isInteracting = true;
                densityLayer.style("opacity", 0.2);
            }

            function dragged(d) {
                d.fx = d3.event.x;
                d.fy = d3.event.y;
            }

            function dragended(d) {
                if (!d3.event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
                if (densityZoomTimer) clearTimeout(densityZoomTimer);
                densityZoomTimer = setTimeout(function(){ isInteracting = false; densityLayer.style("opacity", 1); updateDensity(); }, 140);
            }

            window.addEventListener("resize", function() {
                width = window.innerWidth;
                height = window.innerHeight;
                svg.attr("width", width).attr("height", height);
                simulation.force("center", d3.forceCenter(width / 2, height / 2));
                simulation.alpha(1).restart();
                updateDensity();
                applyLabelSize();
            });

            // Initial density draw
            updateDensity();
            applyLabelSize();
        </script>
