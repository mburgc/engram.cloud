title: "ENGRAM"
description: "Advanced Cognitive Architecture for Artificial Intelligence Systems"
url: "https://engram.cloud"
baseurl: ""
author: "ENGRAM Systems"

markdown: kramdown
highlighter: rouge
permalink: pretty

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

collections:
  posts:
    output: true
    permalink: /:collection/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
  - scope:
      path: ""
    values:
      layout: "default"
